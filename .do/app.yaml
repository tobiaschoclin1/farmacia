name: farmacia
region: nyc

# Database PostgreSQL (incluida en DigitalOcean)
databases:
  - name: farmacia-db
    engine: PG
    version: "16"
    production: false  # Dev database (gratis) - cambiar a true para producción

# Servicio Web (Spring Boot)
services:
  - name: farmacia-web
    # Usar Dockerfile para build
    dockerfile_path: Dockerfile

    # Source
    github:
      repo: tobiaschoclin1/farmacia
      branch: main
      deploy_on_push: true

    # Recursos
    instance_count: 1
    instance_size_slug: basic-xxs  # $5/mes - suficiente para empezar

    # Puerto HTTP
    http_port: 8080

    # Variables de entorno
    envs:
      # Spring Boot
      - key: SPRING_PROFILES_ACTIVE
        value: "production"

      # Puerto (DigitalOcean lo asigna automáticamente)
      - key: PORT
        scope: RUN_TIME
        value: "8080"

      # Database (DigitalOcean conecta automáticamente)
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${farmacia-db.DATABASE_URL}

      - key: DATABASE_USER
        scope: RUN_TIME
        type: SECRET
        value: ${farmacia-db.USERNAME}

      - key: DATABASE_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ${farmacia-db.PASSWORD}

      # Java Options
      - key: JAVA_OPTS
        value: "-Xmx512m -Xms256m"

    # Health Check
    health_check:
      http_path: /api/dashboard/kpis
      initial_delay_seconds: 40
      period_seconds: 30
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3

    # Routes (dominio)
    routes:
      - path: /
