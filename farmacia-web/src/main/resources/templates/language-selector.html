<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Language Selector</title>
</head>
<body>
    <!-- Componente de selección de idioma -->
    <div th:fragment="language-selector" class="language-selector">
        <style>
            .language-selector {
                position: relative;
                display: inline-block;
            }

            .language-button {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 16px;
                background-color: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(74, 123, 167, 0.2);
                border-radius: 12px;
                color: #2C2416;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s ease;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            }

            .language-button:hover {
                background-color: rgba(255, 255, 255, 1);
                border-color: #4A7BA7;
                box-shadow: 0 4px 12px rgba(74, 123, 167, 0.15);
                transform: translateY(-1px);
            }

            .language-text {
                color: #4A7BA7;
                font-weight: 700;
                font-size: 13px;
                letter-spacing: 0.5px;
            }

            .language-chevron {
                color: #6B7280;
                transition: transform 0.2s ease;
            }

            .language-selector.open .language-chevron {
                transform: rotate(180deg);
            }

            .language-menu {
                position: absolute;
                top: calc(100% + 8px);
                right: 0;
                background-color: rgba(255, 255, 255, 0.98);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(74, 123, 167, 0.2);
                border-radius: 12px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
                min-width: 200px;
                padding: 6px;
                display: none;
                z-index: 1000;
                animation: slideDown 0.2s ease-out;
            }

            @keyframes slideDown {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .language-menu.show {
                display: block;
            }

            .language-option {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-radius: 8px;
                color: #2C2416 !important;
                text-decoration: none !important;
                transition: all 0.15s ease;
                position: relative;
                cursor: pointer;
            }

            .language-option:hover {
                background-color: rgba(74, 123, 167, 0.08);
                text-decoration: none !important;
            }

            .language-option:visited,
            .language-option:link,
            .language-option:active,
            .language-option:focus {
                color: #2C2416 !important;
                text-decoration: none !important;
                outline: none;
            }

            .language-option.active {
                background-color: rgba(74, 123, 167, 0.12);
            }

            .flag-emoji {
                font-size: 24px;
                line-height: 1;
                flex-shrink: 0;
            }

            .language-info {
                flex: 1;
            }

            .language-name {
                font-size: 14px;
                font-weight: 600;
                color: #2C2416 !important;
                line-height: 1.3;
                text-decoration: none !important;
                display: block;
            }

            .language-code {
                font-size: 11px;
                color: #6B7280 !important;
                font-weight: 500;
                letter-spacing: 0.5px;
                text-decoration: none !important;
                display: block;
            }

            .language-check {
                color: #4A7BA7;
                margin-left: auto;
                opacity: 0;
                flex-shrink: 0;
            }

            .language-option.active .language-check {
                opacity: 1;
            }

            /* Mobile adjustments */
            @media (max-width: 768px) {
                .language-button {
                    padding: 6px 12px;
                    gap: 6px;
                }

                .language-menu {
                    right: 0;
                    min-width: 180px;
                }
            }
        </style>

        <button class="language-button" onclick="toggleLanguageMenu(event)" aria-label="Change language">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            <span class="language-text" th:text="${#locale.language == 'en' ? 'EN' : 'ES'}">ES</span>
            <svg class="language-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </button>

        <div class="language-menu" id="languageMenu">
            <a th:href="@{''(lang='es')}"
               class="language-option"
               th:classappend="${#locale.language == 'es' ? 'active' : ''}"
               style="text-decoration: none !important; color: #2C2416 !important;">
                <span class="flag-emoji">🇪🇸</span>
                <div class="language-info">
                    <span class="language-name" style="color: #2C2416 !important; text-decoration: none !important;">Español</span>
                    <span class="language-code" style="color: #6B7280 !important; text-decoration: none !important;">ES</span>
                </div>
                <svg class="language-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </a>

            <a th:href="@{''(lang='en')}"
               class="language-option"
               th:classappend="${#locale.language == 'en' ? 'active' : ''}"
               style="text-decoration: none !important; color: #2C2416 !important;">
                <span class="flag-emoji">🇺🇸</span>
                <div class="language-info">
                    <span class="language-name" style="color: #2C2416 !important; text-decoration: none !important;">English</span>
                    <span class="language-code" style="color: #6B7280 !important; text-decoration: none !important;">EN</span>
                </div>
                <svg class="language-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </a>
        </div>

        <script>
            function toggleLanguageMenu(event) {
                event.stopPropagation();
                const button = event.currentTarget;
                const selector = button.closest('.language-selector');
                const menu = selector.querySelector('.language-menu');

                menu.classList.toggle('show');
                selector.classList.toggle('open');
            }

            // Cerrar el menú al hacer click fuera
            document.addEventListener('click', function(event) {
                const selector = event.target.closest('.language-selector');
                if (!selector) {
                    const menus = document.querySelectorAll('.language-menu.show');
                    const selectors = document.querySelectorAll('.language-selector.open');
                    menus.forEach(menu => menu.classList.remove('show'));
                    selectors.forEach(sel => sel.classList.remove('open'));
                }
            });
        </script>
    </div>
</body>
</html>
