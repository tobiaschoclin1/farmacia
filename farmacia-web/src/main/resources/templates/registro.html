<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Farmacia</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/css/theme-sidebar.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #F5F1E8 0%, #E8E3D5 100%);
            padding: 20px;
        }

        .auth-card {
            background-color: var(--surface);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 48px 56px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 520px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .auth-logo {
            width: 110px;
            height: 110px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 12px rgba(74, 123, 167, 0.15));
        }

        .auth-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .auth-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-input-wrapper {
            position: relative;
        }

        .form-input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            pointer-events: none;
            z-index: 1;
            width: 20px;
            height: 20px;
        }

        .form-input-with-icon {
            padding-left: 48px !important;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            color: var(--text-primary);
            background-color: var(--surface);
            transition: all 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        .auth-footer {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-light);
        }

        .auth-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .alert-error {
            background-color: var(--danger-light);
            border: 1px solid var(--danger);
            color: var(--danger-dark);
        }

        .button-full {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
        }

        .password-requirements {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            padding-left: 12px;
        }

        .password-requirements li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <img src="/img/logo.png" alt="Farmacia">
                </div>
                <h1 class="auth-title">Crear Cuenta</h1>
                <p class="auth-subtitle">Completa tus datos para registrarte</p>
            </div>

            <div id="error-message" style="display: none;" class="alert alert-error"></div>

            <form id="registroForm" onsubmit="handleRegistro(event)">
                <div class="form-group">
                    <label class="form-label" for="nombre">Nombre Completo</label>
                    <div class="form-input-wrapper">
                        <svg class="form-input-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" class="form-input-with-icon" id="nombre" name="nombre"
                               placeholder="Juan Pérez" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Correo Electrónico</label>
                    <div class="form-input-wrapper">
                        <svg class="form-input-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" class="form-input-with-icon" id="email" name="email"
                               placeholder="tu@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="form-input-wrapper">
                        <svg class="form-input-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" class="form-input-with-icon" id="password" name="password"
                               placeholder="••••••••" required minlength="8">
                    </div>
                    <ul class="password-requirements">
                        <li>Mínimo 8 caracteres</li>
                        <li>Se recomienda incluir números y símbolos</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirmar Contraseña</label>
                    <div class="form-input-wrapper">
                        <svg class="form-input-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" class="form-input-with-icon" id="confirmPassword" name="confirmPassword"
                               placeholder="••••••••" required minlength="8">
                    </div>
                </div>

                <button type="submit" class="button button-full" id="registroButton">
                    Crear Cuenta
                </button>
            </form>

            <!-- Divider -->
            <div style="position: relative; margin: 32px 0;">
                <div style="position: absolute; inset: 0; display: flex; align-items: center;">
                    <div style="width: 100%; border-top: 1px solid var(--border);"></div>
                </div>
                <div style="position: relative; display: flex; justify-content: center;">
                    <span style="background-color: var(--surface); padding: 0 12px; font-size: 13px; color: var(--text-tertiary);">
                        O regístrate con
                    </span>
                </div>
            </div>

            <!-- Google OAuth Button -->
            <a href="/oauth2/authorization/google" class="button button-full" style="background: white; color: #1f2937; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none; margin-bottom: 16px;">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continuar con Google
            </a>

            <div class="auth-footer">
                <p style="color: var(--text-secondary); font-size: 14px;">
                    ¿Ya tienes una cuenta?
                    <a href="/login" class="auth-link">Inicia sesión aquí</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        async function handleRegistro(event) {
            event.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const button = document.getElementById('registroButton');

            // Validar contraseñas
            if (password !== confirmPassword) {
                showError('Las contraseñas no coinciden');
                return;
            }

            if (password.length < 8) {
                showError('La contraseña debe tener al menos 8 caracteres');
                return;
            }

            button.disabled = true;
            button.textContent = 'Creando cuenta...';

            try {
                const response = await fetch('/api/auth/registro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ nombre, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Redirigir al login con mensaje de éxito
                    window.location.href = '/login?registered=true';
                } else {
                    showError(data.error || 'Error al crear la cuenta');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Error de conexión. Por favor intenta de nuevo.');
            } finally {
                button.disabled = false;
                button.textContent = 'Crear Cuenta';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
