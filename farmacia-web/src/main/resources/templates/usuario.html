<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <title>Mi Perfil - Farmacia</title>
    <link rel="stylesheet" href="/css/theme-sidebar.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/dashboard" class="sidebar-logo">
                    <img src="/img/logo.png" th:alt="#{app.name}" style="width: 40px; height: 40px; border-radius: 10px; object-fit: cover;">
                    <span class="sidebar-logo-text" th:text="#{app.name}">Pharmacy</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title" th:text="#{nav.principal}">Main</div>
                    <a href="/dashboard" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                        </svg>
                        <span th:text="#{nav.dashboard}">Dashboard</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title" th:text="#{nav.gestion}">Management</div>
                    <a href="/productos" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                            <line x1="12" y1="22.08" x2="12" y2="12"></line>
                        </svg>
                        <span th:text="#{nav.productos}">Products</span>
                    </a>
                    <a href="/stock" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M3 3h18v18H3z M3 9h18 M9 21V9"></path>
                        </svg>
                        <span th:text="#{nav.stock}">Stock</span>
                    </a>
                    <a href="/vencimientos" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span th:text="#{nav.vencimientos}">Expirations</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title" th:text="#{nav.movimientos}">Movements</div>
                    <a href="/entradas" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <polyline points="19 12 12 19 5 12"></polyline>
                        </svg>
                        <span th:text="#{nav.entradas}">Entries</span>
                    </a>
                    <a href="/salidas" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                        <span th:text="#{nav.salidas}">Exits</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title" th:text="#{nav.sistema}">System</div>
                    <a href="/configuracion" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                        <span th:text="#{nav.configuracion}">Settings</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <a href="/usuario" class="sidebar-profile">
                    <div class="sidebar-avatar">TC</div>
                    <div class="sidebar-profile-info">
                        <div class="sidebar-profile-name">Tobias Choclin</div>
                        <div class="sidebar-profile-role" th:text="#{profile.administrator}">Administrator</div>
                    </div>
                </a>
            </div>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-wrapper">
            <!-- Language Selector -->
            <div class="lang-bar">
                <div th:replace="~{language-selector :: language-selector}"></div>
            </div>

            <div class="main-content">
                <div class="page-header">
                    <h1 class="page-title" th:text="#{#locale.language == 'en' ? 'My Profile' : 'Mi Perfil'}">My Profile</h1>
                    <p class="page-subtitle" th:text="#{#locale.language == 'en' ? 'Manage your personal information and preferences' : 'Gestiona tu información personal y preferencias'}">Manage your personal information and preferences</p>
                </div>

                <!-- Cabecera del perfil -->
                <div class="profile-header">
                    <div class="profile-avatar-large" id="profileAvatarLarge">TC</div>
                    <div class="profile-info">
                        <h2 id="profileName" th:text="#{profile.user}">User</h2>
                        <p id="profileRole" th:text="#{common.loading}">Loading...</p>
                    </div>
                </div>

                <!-- Formulario de información personal -->
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-header">
                        <h3 class="card-title" th:text="#{usuario.section.personal}">Personal information</h3>
                    </div>

                    <form id="profileForm" onsubmit="saveProfile(event)">
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
                            <div class="form-group">
                                <label class="form-label" th:text="#{usuario.form.fullname}">Full name</label>
                                <input type="text" class="form-input" id="nombre" value="" required>
                            </div>

                            <div class="form-group">
                                <label class="form-label" th:text="#{usuario.form.email}">Email address</label>
                                <input type="email" class="form-input" id="email" value="" required>
                            </div>

                            <div class="form-group">
                                <label class="form-label" th:text="#{usuario.form.phone}">Phone</label>
                                <input type="text" class="form-input" id="telefono" value="" th:placeholder="#{common.optional}">
                            </div>

                            <div class="form-group">
                                <label class="form-label" th:text="#{usuario.form.role}">Role</label>
                                <input type="text" class="form-input" id="rol" value="" disabled>
                            </div>
                        </div>

                        <div style="margin-top: 24px; display: flex; gap: 12px;">
                            <button type="submit" class="button" th:text="#{config.button.save}">Save changes</button>
                            <button type="button" class="button ghost" onclick="resetForm()" th:text="#{common.cancel}">Cancel</button>
                        </div>
                    </form>
                </div>

                <!-- Cambiar contraseña -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title" th:text="#{usuario.section.password}">Change password</h3>
                    </div>

                    <form id="passwordForm" onsubmit="changePassword(event)">
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
                            <div class="form-group">
                                <label class="form-label" th:text="#{usuario.form.current.password}">Current password</label>
                                <input type="password" class="form-input" id="currentPassword" required>
                            </div>

                            <div></div>

                            <div class="form-group">
                                <label class="form-label" th:text="#{usuario.form.new.password}">New password</label>
                                <input type="password" class="form-input" id="newPassword" required minlength="8">
                            </div>

                            <div class="form-group">
                                <label class="form-label" th:text="#{usuario.form.confirm.password}">Confirm new password</label>
                                <input type="password" class="form-input" id="confirmPassword" required minlength="8">
                            </div>
                        </div>

                        <div style="margin-top: 24px;">
                            <button type="submit" class="button warning" th:text="#{usuario.button.change.password}">Change password</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/session.js"></script>
    <script th:inline="javascript">
        const MSG = {
            user: /*[[#{profile.user}]]*/ 'User',
            profileSaved: /*[[#{usuario.alert.profile.saved}]]*/ 'Profile updated successfully',
            passwordMismatch: /*[[#{usuario.alert.password.mismatch}]]*/ 'Passwords do not match',
            passwordChanged: /*[[#{usuario.alert.password.changed}]]*/ 'Password changed successfully'
        };
        // Cargar datos del usuario desde la sesión
        function loadUserProfile() {
            const user = getCurrentUser();
            if (!user) return;

            // Actualizar cabecera del perfil
            const iniciales = user.nombre
                ? user.nombre.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase()
                : 'U';

            document.getElementById('profileAvatarLarge').textContent = iniciales;
            document.getElementById('profileName').textContent = user.nombre || MSG.user;
            document.getElementById('profileRole').textContent = user.rol || MSG.user;

            // Llenar formulario
            document.getElementById('nombre').value = user.nombre || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('rol').value = user.rol || '';
        }

        function saveProfile(event) {
            event.preventDefault();

            const user = getCurrentUser();
            if (!user) return;

            const formData = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                telefono: document.getElementById('telefono').value
            };

            // Actualizar datos en sessionStorage
            user.nombre = formData.nombre;
            user.email = formData.email;
            sessionStorage.setItem('user', JSON.stringify(user));

            console.log('Guardando perfil:', formData);
            alert(MSG.profileSaved);

            // Recargar datos
            loadUserProfile();
        }

        function changePassword(event) {
            event.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                alert(MSG.passwordMismatch);
                return;
            }

            console.log('Cambiando contraseña');
            alert(MSG.passwordChanged);
            document.getElementById('passwordForm').reset();
        }

        function resetForm() {
            loadUserProfile();
        }

        // Cargar perfil al iniciar
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadUserProfile);
        } else {
            loadUserProfile();
        }
    </script>
</body>
</html>
