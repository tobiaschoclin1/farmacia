<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <title th:text="#{stock.title} + ' - ' + #{app.name}">Stock - Pharmacy</title>
    <link rel="stylesheet" href="/css/theme-sidebar.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/dashboard" class="sidebar-logo">
                    <img src="/img/logo.png" th:alt="#{app.name}" style="width: 40px; height: 40px; border-radius: 10px; object-fit: cover;">
                    <span class="sidebar-logo-text" th:text="#{app.name}">Pharmacy</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title" th:text="#{nav.principal}">Main</div>
                    <a href="/dashboard" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                        </svg>
                        <span th:text="#{nav.dashboard}">Dashboard</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title" th:text="#{nav.gestion}">Management</div>
                    <a href="/productos" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                            <line x1="12" y1="22.08" x2="12" y2="12"></line>
                        </svg>
                        <span th:text="#{nav.productos}">Products</span>
                    </a>
                    <a href="/stock" class="nav-item active">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M3 3h18v18H3z M3 9h18 M9 21V9"></path>
                        </svg>
                        <span th:text="#{nav.stock}">Stock</span>
                    </a>
                    <a href="/vencimientos" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span th:text="#{nav.vencimientos}">Expirations</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title" th:text="#{nav.movimientos}">Movements</div>
                    <a href="/entradas" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <polyline points="19 12 12 19 5 12"></polyline>
                        </svg>
                        <span th:text="#{nav.entradas}">Entries</span>
                    </a>
                    <a href="/salidas" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                        <span th:text="#{nav.salidas}">Exits</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title" th:text="#{nav.sistema}">System</div>
                    <a href="/configuracion" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                        <span th:text="#{nav.configuracion}">Settings</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <a href="/usuario" class="sidebar-profile">
                    <div class="sidebar-avatar">TC</div>
                    <div class="sidebar-profile-info">
                        <div class="sidebar-profile-name">Tobias Choclin</div>
                        <div class="sidebar-profile-role" th:text="#{profile.administrator}">Administrator</div>
                    </div>
                </a>
            </div>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-wrapper">
            <!-- Language Selector -->
            <div class="lang-bar">
                <div th:replace="~{language-selector :: language-selector}"></div>
            </div>

            <div class="main-content">
                <div class="page-header">
                    <h1 class="page-title" th:text="#{stock.title}">Stock</h1>
                    <p class="page-subtitle" th:text="#{stock.subtitle}">Inventory control and alerts</p>
                </div>

            <div class="card">
                <div style="display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;">
                    <input type="text" id="search" th:placeholder="#{stock.search.placeholder}" style="flex: 1; min-width: 200px;">
                    <select id="filtroEstado" onchange="applyFilters()">
                        <option value="" th:text="#{stock.filter.all}">All</option>
                        <option value="EN_STOCK" th:text="#{stock.filter.in.stock}">In Stock</option>
                        <option value="STOCK_BAJO" th:text="#{stock.filter.low.stock}">Low Stock</option>
                        <option value="SIN_STOCK" th:text="#{stock.filter.out.of.stock}">Out of Stock</option>
                    </select>
                    <select id="ordenamiento" onchange="applyFilters()">
                        <option value="nombre" th:text="#{stock.sort.name}">Sort by name</option>
                        <option value="stockActual" th:text="#{stock.sort.stock}">Sort by stock</option>
                        <option value="estado" th:text="#{stock.sort.status}">Sort by status</option>
                    </select>
                    <button onclick="loadStock()"><span th:text="#{common.search}">Search</span></button>
                </div>

                <div id="loading"><span th:text="#{stock.loading}">Loading stock...</span></div>
                <div id="stock-table" style="display: none;">
                    <table>
                        <thead>
                            <tr>
                                <th th:text="#{stock.table.product}">Product</th>
                                <th th:text="#{common.code}">Code</th>
                                <th th:text="#{stock.table.unit}">Unit</th>
                                <th th:text="#{stock.table.current.stock}">Current Stock</th>
                                <th th:text="#{stock.table.min.stock}">Minimum Stock</th>
                                <th th:text="#{stock.table.status}">Status</th>
                                <th th:text="#{stock.table.actions}">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="stock-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- Modal para ver lotes -->
            <div id="lotesModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
                <div class="card" style="max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2 style="font-size: 20px; font-weight: 600; margin: 0;" th:text="#{stock.lots.title}">Product Lots</h2>
                        <button onclick="cerrarModal()" class="button ghost" style="padding: 8px;">✕</button>
                    </div>
                    <div id="lotes-content"></div>
                </div>
            </div>
        </main>
    </div>

    <script th:inline="javascript">
        const MSG = {
            statusIn: /*[[#{stock.status.in.stock}]]*/ 'In Stock',
            statusLow: /*[[#{stock.status.low.stock}]]*/ 'Low Stock',
            statusOut: /*[[#{stock.status.out.of.stock}]]*/ 'Out of Stock',
            viewLots: /*[[#{stock.button.view.lots}]]*/ 'View Lots',
            noLots: /*[[#{stock.lots.empty}]]*/ 'No lots with stock for this product',
            noExpiry: /*[[#{stock.lots.no.expiry}]]*/ 'No expiry date',
            errLoad: /*[[#{stock.error.load}]]*/ 'Error loading stock',
            errLots: /*[[#{stock.error.lots}]]*/ 'Error loading product lots'
        };

        let stockData = [];

        async function loadStock() {
            const search = document.getElementById('search').value;
            const url = search ? `/api/stock?filtro=${encodeURIComponent(search)}` : '/api/stock';

            try {
                const response = await fetch(url);
                stockData = await response.json();
                applyFilters();
            } catch (error) {
                console.error('Error loading stock:', error);
                document.getElementById('loading').textContent = MSG.errLoad;
            }
        }

        function applyFilters() {
            const filtroEstado = document.getElementById('filtroEstado').value;
            const ordenamiento = document.getElementById('ordenamiento').value;

            // Filtrar
            let filtered = [...stockData];
            if (filtroEstado) {
                filtered = filtered.filter(item => item.estado === filtroEstado);
            }

            // Ordenar
            if (ordenamiento === 'nombre') {
                filtered.sort((a, b) => a.nombre.localeCompare(b.nombre));
            } else if (ordenamiento === 'stockActual') {
                filtered.sort((a, b) => a.stockActual - b.stockActual);
            } else if (ordenamiento === 'estado') {
                const estadoOrder = { 'SIN_STOCK': 0, 'STOCK_BAJO': 1, 'EN_STOCK': 2 };
                filtered.sort((a, b) => estadoOrder[a.estado] - estadoOrder[b.estado]);
            }

            renderStock(filtered);
        }

        function renderStock(stock) {
            const tbody = document.getElementById('stock-body');
            tbody.innerHTML = stock.map(item => {
                const estadoBadge = {
                    'EN_STOCK': `<span class="badge success">${MSG.statusIn}</span>`,
                    'STOCK_BAJO': `<span class="badge warning">${MSG.statusLow}</span>`,
                    'SIN_STOCK': `<span class="badge danger">${MSG.statusOut}</span>`
                }[item.estado];

                const rowClass = {
                    'EN_STOCK': 'in-stock',
                    'STOCK_BAJO': 'medium-stock',
                    'SIN_STOCK': 'low-stock'
                }[item.estado];

                return `
                    <tr class="${rowClass}">
                        <td><strong>${item.nombre}</strong></td>
                        <td>${item.codigoBarra || '-'}</td>
                        <td>${item.unidadBase}</td>
                        <td><strong>${item.stockActual}</strong></td>
                        <td>${item.stockMinimo}</td>
                        <td>${estadoBadge}</td>
                        <td>
                            <button onclick="verLotes(${item.id}, '${item.nombre}')" class="button small">
                                ${MSG.viewLots}
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            document.getElementById('loading').style.display = 'none';
            document.getElementById('stock-table').style.display = 'block';
        }

        async function verLotes(productoId, nombreProducto) {
            try {
                const response = await fetch(`/api/stock/lotes?productoId=${productoId}`);
                const lotes = await response.json();

                const content = document.getElementById('lotes-content');

                if (lotes.length === 0) {
                    content.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                            ${MSG.noLots}
                        </div>
                    `;
                } else {
                    content.innerHTML = `
                        <h3 style="margin-bottom: 16px; color: var(--text-primary);">${nombreProducto}</h3>
                        <table style="margin-top: 0;">
                            <thead>
                                <tr>
                                    <th th:text="#{stock.lots.date}">Batch Date</th>
                                    <th th:text="#{vencimientos.table.expiry.date}">Expiry Date</th>
                                    <th th:text="#{common.quantity}">Quantity</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${lotes.map(lote => `
                                    <tr>
                                        <td>${lote.fechaLote || '-'}</td>
                                        <td>${lote.fechaVencimiento || MSG.noExpiry}</td>
                                        <td><strong>${lote.cantidad}</strong></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                }

                document.getElementById('lotesModal').style.display = 'flex';
            } catch (error) {
                console.error('Error loading lots:', error);
                alert(MSG.errLots);
            }
        }

        function cerrarModal() {
            document.getElementById('lotesModal').style.display = 'none';
        }

        // Cargar al inicio con filtros de URL
        function initStock() {
            const params = new URLSearchParams(window.location.search);
            const estado = params.get('estado');

            if (estado) {
                document.getElementById('filtroEstado').value = estado;
            }

            loadStock();
        }

        initStock();

        // Buscar al presionar Enter
        document.getElementById('search').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadStock();
        });

        // Cerrar modal con ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') cerrarModal();
        });
    </script>
    <script src="/js/session.js"></script>
</body>
</html>
