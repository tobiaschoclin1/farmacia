<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <title th:text="#{entradas.title} + ' - ' + #{app.name}">Entries - Pharmacy</title>
    <link rel="stylesheet" href="/css/theme-sidebar.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/dashboard" class="sidebar-logo">
                    <img src="/img/logo.png" th:alt="#{app.name}" style="width: 40px; height: 40px; border-radius: 10px; object-fit: cover;">
                    <span class="sidebar-logo-text" th:text="#{app.name}">Pharmacy</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title" th:text="#{nav.principal}">Main</div>
                    <a href="/dashboard" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                        </svg>
                        <span th:text="#{nav.dashboard}">Dashboard</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title" th:text="#{nav.gestion}">Management</div>
                    <a href="/productos" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                            <line x1="12" y1="22.08" x2="12" y2="12"></line>
                        </svg>
                        <span th:text="#{nav.productos}">Products</span>
                    </a>
                    <a href="/stock" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M3 3h18v18H3z M3 9h18 M9 21V9"></path>
                        </svg>
                        <span th:text="#{nav.stock}">Stock</span>
                    </a>
                    <a href="/vencimientos" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span th:text="#{nav.vencimientos}">Expirations</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title" th:text="#{nav.movimientos}">Movements</div>
                    <a href="/entradas" class="nav-item active">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <polyline points="19 12 12 19 5 12"></polyline>
                        </svg>
                        <span th:text="#{nav.entradas}">Entries</span>
                    </a>
                    <a href="/salidas" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                        <span th:text="#{nav.salidas}">Exits</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title" th:text="#{nav.sistema}">System</div>
                    <a href="/configuracion" class="nav-item">
                        <svg class="nav-item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                        <span th:text="#{nav.configuracion}">Settings</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <a href="/usuario" class="sidebar-profile">
                    <div class="sidebar-avatar">TC</div>
                    <div class="sidebar-profile-info">
                        <div class="sidebar-profile-name">Tobias Choclin</div>
                        <div class="sidebar-profile-role" th:text="#{profile.administrator}">Administrator</div>
                    </div>
                </a>
            </div>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-wrapper">
            <!-- Language Selector -->
            <div class="lang-bar">
                <div th:replace="~{language-selector :: language-selector}"></div>
            </div>

            <div class="main-content">
                <div class="page-header">
                    <h1 class="page-title" th:text="#{entradas.title}">Entries</h1>
                    <p class="page-subtitle" th:text="#{entradas.subtitle}">Incoming merchandise log</p>
                </div>

            <div class="card">
                <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 20px;" th:text="#{entradas.modal.new.title}">New Entry</h3>

                <div style="margin-bottom: 20px;">
                    <label class="form-label" style="display: block; margin-bottom: 8px;" th:text="#{entradas.form.user}">User</label>
                    <input type="text" id="usuario" th:placeholder="#{entradas.user.placeholder}" value="Sistema Web">
                </div>

                <div style="margin-bottom: 20px;">
                    <label class="form-label" style="display: block; margin-bottom: 8px;" th:text="#{entradas.form.search}">Search product</label>
                    <div style="display: flex; gap: 12px;">
                        <input type="text" id="search-producto" th:placeholder="#{entradas.search.placeholder}" style="flex: 1;">
                        <button onclick="buscarProducto()" th:text="#{common.search}">Search</button>
                    </div>
                    <div id="search-results" style="margin-top: 12px;"></div>
                </div>

                <div style="margin-bottom: 20px;">
                    <h4 style="font-size: 16px; font-weight: 600; margin-bottom: 12px;" th:text="#{entradas.items.title}">Products to receive</h4>
                    <div id="items-container"></div>
                    <div id="empty-state" style="text-align: center; padding: 40px; color: var(--text-secondary);">
                        <span th:text="#{entradas.empty.hint}">Search and add products to record the entry</span>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                    <button onclick="limpiarFormulario()" class="button secondary" th:text="#{entradas.button.clear}">Clear</button>
                    <button onclick="registrarEntrada()" class="button success" id="btn-registrar" th:text="#{entradas.button.register}">Register Entry</button>
                </div>
            </div>
        </main>
    </div>

    <script th:inline="javascript">
        const MSG = {
            code: /*[[#{common.code}]]*/ 'Code',
            searchNone: /*[[#{entradas.search.none}]]*/ 'No products found',
            already: /*[[#{entradas.alert.already}]]*/ 'This product is already added',
            remove: /*[[#{entradas.button.remove}]]*/ 'Remove',
            batchDate: /*[[#{entradas.field.batch.date}]]*/ 'Batch date',
            expiryOpt: /*[[#{entradas.field.expiry.optional}]]*/ 'Expiry date (optional)',
            quantity: /*[[#{common.quantity}]]*/ 'Quantity',
            emptyAlert: /*[[#{entradas.alert.empty}]]*/ 'You must add at least one product',
            registering: /*[[#{entradas.button.registering}]]*/ 'Registering...',
            register: /*[[#{entradas.button.register}]]*/ 'Register Entry',
            success: /*[[#{entradas.alert.success}]]*/ 'Entry registered successfully',
            unknown: /*[[#{entradas.alert.error.generic}]]*/ 'Unknown error',
            errRegister: /*[[#{entradas.alert.error}]]*/ 'Error registering entry'
        };

        let itemsEntrada = [];

        async function buscarProducto() {
            const search = document.getElementById('search-producto').value;
            if (!search) return;

            try {
                const response = await fetch(`/api/productos?filtro=${encodeURIComponent(search)}`);
                const productos = await response.json();

                const results = document.getElementById('search-results');
                if (productos.length === 0) {
                    results.innerHTML = `<p style="color: var(--text-secondary);">${MSG.searchNone}</p>`;
                    return;
                }

                results.innerHTML = `
                    <div style="max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; padding: 8px;">
                        ${productos.slice(0, 5).map(p => `
                            <div onclick="agregarProducto(${p.id}, '${p.nombre}')"
                                 style="padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 4px;"
                                 onmouseover="this.style.backgroundColor='var(--surface-hover)'"
                                 onmouseout="this.style.backgroundColor='transparent'">
                                <strong>${p.nombre}</strong>
                                ${p.codigoBarra ? `<br><small style="color: var(--text-secondary);">${MSG.code}: ${p.codigoBarra}</small>` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('Error searching products:', error);
            }
        }

        function agregarProducto(id, nombre) {
            // Verificar si ya existe
            if (itemsEntrada.find(i => i.productoId === id)) {
                alert(MSG.already);
                return;
            }

            const hoy = new Date().toISOString().split('T')[0];

            itemsEntrada.push({
                productoId: id,
                nombre: nombre,
                fechaLote: hoy,
                fechaVencimiento: '',
                cantidad: 1
            });

            document.getElementById('search-results').innerHTML = '';
            document.getElementById('search-producto').value = '';
            renderItems();
        }

        function renderItems() {
            const container = document.getElementById('items-container');
            const emptyState = document.getElementById('empty-state');

            if (itemsEntrada.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            container.innerHTML = itemsEntrada.map((item, index) => `
                <div class="card" style="margin-bottom: 12px; padding: 16px; background: var(--surface-hover);">
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                        <strong style="font-size: 16px;">${item.nombre}</strong>
                        <button onclick="eliminarItem(${index})" class="button danger small">${MSG.remove}</button>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
                        <div>
                            <label class="form-label" style="display: block; margin-bottom: 4px; font-size: 12px;">${MSG.batchDate}</label>
                            <input type="date" value="${item.fechaLote}"
                                   onchange="itemsEntrada[${index}].fechaLote = this.value">
                        </div>
                        <div>
                            <label class="form-label" style="display: block; margin-bottom: 4px; font-size: 12px;">${MSG.expiryOpt}</label>
                            <input type="date" value="${item.fechaVencimiento}"
                                   onchange="itemsEntrada[${index}].fechaVencimiento = this.value">
                        </div>
                        <div>
                            <label class="form-label" style="display: block; margin-bottom: 4px; font-size: 12px;">${MSG.quantity}</label>
                            <input type="number" min="1" value="${item.cantidad}"
                                   onchange="itemsEntrada[${index}].cantidad = parseInt(this.value)">
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function eliminarItem(index) {
            itemsEntrada.splice(index, 1);
            renderItems();
        }

        function limpiarFormulario() {
            itemsEntrada = [];
            document.getElementById('search-producto').value = '';
            document.getElementById('search-results').innerHTML = '';
            renderItems();
        }

        async function registrarEntrada() {
            if (itemsEntrada.length === 0) {
                alert(MSG.emptyAlert);
                return;
            }

            const usuario = document.getElementById('usuario').value || 'Sistema Web';
            const btn = document.getElementById('btn-registrar');
            btn.disabled = true;
            btn.textContent = MSG.registering;

            try {
                const response = await fetch('/api/entradas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuario: usuario,
                        items: itemsEntrada
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    alert(MSG.success);
                    limpiarFormulario();
                } else {
                    alert('Error: ' + (result.error || MSG.unknown));
                }
            } catch (error) {
                console.error('Error registering entry:', error);
                alert(MSG.errRegister);
            } finally {
                btn.disabled = false;
                btn.textContent = MSG.register;
            }
        }

        // Buscar al presionar Enter
        document.getElementById('search-producto').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscarProducto();
        });
    </script>
    <script src="/js/session.js"></script>
</body>
</html>
